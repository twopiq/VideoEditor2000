name: Windows build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
        env:
          QT_QPA_PLATFORM: offscreen

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write   # v* teglarida GitHub Release yaratish uchun
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller pytest
      - name: Testlar (Windows)
        run: python -m pytest -q tests
        env:
          QT_QPA_PLATFORM: offscreen
      - name: .exe yig'ish
        run: pyinstaller --noconfirm build.spec
      - name: Yig'ilgan .exe ni sinash
        shell: pwsh
        run: |
          $p = Start-Process -FilePath 'dist\VideoEditor2000\VideoEditor2000.exe' -ArgumentList '--self-test' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "self-test chiqish kodi: $($p.ExitCode)" }
      - name: Arxivlash
        shell: pwsh
        run: Compress-Archive -Path dist\VideoEditor2000 -DestinationPath VideoEditor2000-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: VideoEditor2000-windows
          path: dist/VideoEditor2000
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VideoEditor2000-windows.zip
